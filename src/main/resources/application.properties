spring.application.name=JWT_Security_Service

# Database Configuration with Environment Variable Fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kvlogics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:muruga}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Advanced JWT Production Configuration
jwt.secret=${JWT_SECRET:TmV3U2VjcmV0S2V5Rm9ySldTU2lnbmluZ1B1cnBvc2VzSW5MYXllcmVkQXJjaGl0ZWN0dXJl}
jwt.issuer=${JWT_ISSUER:https://auth.kvlogics.com}
jwt.audience=${JWT_AUDIENCE:https://api.kvlogics.com}

# Access Token Validity (15 minutes in milliseconds = 900000)
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}

# Refresh Token Validity (7 days in milliseconds = 604800000)
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Default Administrative User
spring.security.user.name=murugar
spring.security.user.password=murugar
